---
- name: Ensure custom Crypto Policies are set
  ansible.builtin.lineinfile:
    path: "{{ item['path'] }}"
    line: "{{ item['line'] }}"
    owner: root
    group: root
    mode: '0640'
    create: true
  loop:
    - path: /etc/crypto-policies/policies/modules/NO-SSHCBC.pmod
      line: cipher@SSH = -*-CBC
    - path: /etc/crypto-policies/policies/modules/NO-SSHWEAKCIPHERS.pmod
      line: cipher@SSH = -3DES-CBC -AES-128-CBC -AES-192-CBC -AES-256-CBC
    - path: /etc/crypto-policies/policies/modules/NO-SSHWEAKMACS.pmod
      line: mac@SSH = -HMAC-MD5* -UMAC-64* -UMAC-128* -HMAC-SHA1*
    - path: /etc/crypto-policies/policies/modules/NO-WEAKMAC.pmod
      line: mac = -*-128*
  notify:
    - Update crypto policies
    - Restart sshd
  tags:
    - sshd

- name: Copy sshd configs
  ansible.builtin.template:
    src: "{{ item['src'] }}"
    dest: "{{ item['dest'] }}"
    owner: root
    group: root
    mode: '0600'
  loop:
    - src: sshd_config.j2
      dest: /etc/ssh/sshd_config
    - src: 50-redhat.conf.j2
      dest: /etc/ssh/sshd_config.d/50-redhat.conf
  notify: Restart sshd
  tags:
    - sshd

- name: Allow sshd to listen on custom port
  redhat.rhel_system_roles.seport:
    ports: "{{ sshd_port }}"
    proto: tcp
    setype: ssh_port_t
    state: present
  when:
    - sshd_port is defined
  tags:
    - sshd
    - sshd_custom_port
